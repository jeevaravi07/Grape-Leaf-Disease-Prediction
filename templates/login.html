{% extends "base.html" %}
{% block content %}
<style>
    .auth-card {
        border-radius: 1rem;
        border: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        transition: transform 0.3s ease;
    }
    .auth-card:hover {
        transform: translateY(-5px);
    }
    
    /* Input Icon Styling */
    .input-group-text {
        background-color: transparent;
        border-right: none;
        color: #198754;
    }
    .form-control {
        border-left: none;
    }
    .form-control:focus {
        box-shadow: none;
        border-color: #dee2e6;
    }
    
    /* Add green glow when clicking inside the input */
    .input-group:focus-within {
        box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        border-radius: 0.375rem;
    }
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control {
        border-color: #198754;
    }

    /* Gradient Button */
    .btn-auth {
        background: linear-gradient(90deg, #198754 0%, #20c997 100%);
        border: none;
        font-weight: 500;
        letter-spacing: 0.5px;
    }
    .btn-auth:hover {
        background: linear-gradient(90deg, #157347 0%, #1ba87e 100%);
        color: white;
    }
</style>

<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card auth-card">
            <div class="card-body p-4 p-md-5">
                
                <!-- Header -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-10 text-success mb-3" style="width: 65px; height: 65px;">
                        <i class="bi bi-person-fill fs-1"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your vineyard dashboard.</p>
                </div>
                
                <!-- Form -->
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-medium small text-dark">Email Address</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control py-2" placeholder="name@example.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-medium small text-dark">Password</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control py-2" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-auth text-white w-100 rounded-pill py-2 shadow-sm mb-4">
                        Sign In
                    </button>
                </form>
                
                <!-- Footer link -->
                <div class="text-center">
                    <small class="text-muted">
                        Don't have an account? 
                        <a href="{{ url_for('register') }}" class="text-success text-decoration-none fw-semibold">Register here</a>
                    </small>
                </div>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
