
services:
  - type: web
    name: grapeguard-ai
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /

    envVars:
      - key: GRAPEGUARD_SECRET_KEY
        generateValue: true

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: DATA_DIR
        value: /app/data

    autoDeploy: true
